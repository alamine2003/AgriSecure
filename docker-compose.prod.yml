# Docker Compose pour production AVEC NGINX
# Utilisation: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    environment:
      - NGINX_MODE=prod
    ports:
      - "80:80"
      - "443:443"

  backend:
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - CAMERA_INDEX=0
      - CAMERA_FPS=15
      - YOLO_CONFIDENCE_THRESHOLD=0.5
      - YOLO_CACHE_TTL_SECONDS=30

  frontend:
    build:
      context: ./frontend
      target: production-stage
    # En prod, nginx sert les fichiers statiques buildés

  celery-worker:
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - CAMERA_INDEX=0
      - CAMERA_FPS=15

  celery-beat:
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
