server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs des conteneurs Docker
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # Logs de l'application surveillance
  - job_name: surveillance-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: surveillance
          __path__: /var/log/surveillance/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            camera_id: camera_id
            user_id: user_id
            metric_type: metric_type
      - labels:
          level:
          service:
          camera_id:
          user_id:
          metric_type:
      - output:
          source: message
