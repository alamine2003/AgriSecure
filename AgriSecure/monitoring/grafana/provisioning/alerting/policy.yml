apiVersion: 1

policies:
  - orgId: 1
    receiver: agriwatch-admin-email
    group_by: [grafana_folder, alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Alertes critiques — notif rapide, répétition fréquente
      - receiver: agriwatch-admin-email
        matchers:
          - severity =~ "critical"
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h

      # Alertes caméras / détections — surveillance prioritaire
      - receiver: agriwatch-admin-email
        matchers:
          - service =~ "camera|detection"
        group_wait: 30s
        group_interval: 2m
        repeat_interval: 4h

      # Alertes info — digest quotidien uniquement
      - receiver: agriwatch-admin-email
        matchers:
          - severity = "info"
        group_wait: 1h
        group_interval: 1h
        repeat_interval: 24h
