# Docker Compose pour développement SANS NGINX
# Utilisation: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Camera: Sur Windows, attacher la caméra via USBIPD avant de lancer:
#   usbipd list
#   usbipd attach --wsl --busid <BUS_ID>

services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - CAMERA_FPS=${CAMERA_FPS:-15}
      - YOLO_CONFIDENCE_THRESHOLD=0.5
      - YOLO_CACHE_TTL_SECONDS=30
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    group_add:
      - "${VIDEO_GID:-44}"

  frontend:
    build:
      context: ./frontend
      target: build-stage
    command: npm run dev -- --host 0.0.0.0 --port 3000
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules

  celery-worker:
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - CAMERA_FPS=${CAMERA_FPS:-15}
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    group_add:
      - "${VIDEO_GID:-44}"

  celery-beat:
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
