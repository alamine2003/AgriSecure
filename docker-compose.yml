services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - /app/__pycache__
    env_file:
      - .env
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - DATABASE_URL=postgres://${POSTGRES_USER:-surveillance_user}:${POSTGRES_PASSWORD:-StrongPass123!}@postgres:5432/${POSTGRES_DB:-surveillance_db}
      - DB_HOST=postgres
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_BROKER_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - surveillance_net
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - DATABASE_URL=postgres://${POSTGRES_USER:-surveillance_user}:${POSTGRES_PASSWORD:-StrongPass123!}@postgres:5432/${POSTGRES_DB:-surveillance_db}
      - DB_HOST=postgres
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core worker -l info --concurrency=2
    networks:
      - surveillance_net
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - DATABASE_URL=postgres://${POSTGRES_USER:-surveillance_user}:${POSTGRES_PASSWORD:-StrongPass123!}@postgres:5432/${POSTGRES_DB:-surveillance_db}
      - DB_HOST=postgres
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - surveillance_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    networks:
      - surveillance_net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    environment:
      - NGINX_MODE=dev
    depends_on:
      - backend
      - frontend
    networks:
      - surveillance_net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surveillance_user} -d ${POSTGRES_DB:-surveillance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surveillance_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surveillance_net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - surveillance_net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-PgAdmin789!}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - surveillance_net
    restart: unless-stopped

  flower:
    image: mher/flower:latest
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-flower_admin}:${FLOWER_PASSWORD:-Flower321!}
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - backend
    networks:
      - surveillance_net
    restart: unless-stopped

networks:
  surveillance_net:
    driver: bridge
    name: surveillance_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
