services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/media:/app/media:ro
      - ./backend/static:/app/static:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - surveillance_net

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --run-syncdb && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media
      - ./backend/static:/app/static
    devices:
      - "${VIDEO_DEVICE:-/dev/null}:/dev/video0"
    group_add:
      - "${VIDEO_GID:-44}"
    restart: on-failure
    networks:
      - surveillance_net

  frontend:
    build: ./frontend
    expose:
      - "80"
    networks:
      - surveillance_net

  postgres:
    build: ./postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surveillance_net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surveillance_net

  celery-worker:
    build: ./backend
    command: celery -A core worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres
    devices:
      - "${VIDEO_DEVICE:-/dev/null}:/dev/video0"
    group_add:
      - "${VIDEO_GID:-44}"
    volumes:
      - ./backend/media:/app/media
    networks:
      - surveillance_net
    restart: on-failure

  celery-beat:
    build: ./backend
    command: celery -A core beat -l info
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - surveillance_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - surveillance_net

  pgadmin:
    build: ./pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - surveillance_net

  flower:
    image: mher/flower:2.0
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - celery-worker
    networks:
      - surveillance_net

networks:
  surveillance_net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
