# Override local pour développement (appliqué automatiquement)
# Ce fichier est mergé avec docker-compose.yml par défaut
# Camera Windows/USBIPD: la variable VIDEO_DEVICE est configurable dans .env

services:
  backend:
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - CAMERA_FPS=${CAMERA_FPS:-15}
      - YOLO_CONFIDENCE_THRESHOLD=0.5
      - YOLO_CACHE_TTL_SECONDS=30
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    group_add:
      - "${VIDEO_GID:-44}"

  celery-worker:
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - CAMERA_FPS=${CAMERA_FPS:-15}
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:/dev/video0"
    group_add:
      - "${VIDEO_GID:-44}"
