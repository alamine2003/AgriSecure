groups:
  - name: backend_alerts
    interval: 30s
    rules:
      # Django Backend Down
      - alert: BackendDown
        expr: up{job="django-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend Django est arrêté"
          description: "Le backend Django ({{ $labels.instance }}) est inaccessible depuis plus de 1 minute."

      # High Response Time
      - alert: HighResponseTime
        expr: django_http_requests_latency_seconds_by_view_method{quantile="0.95"} > 1
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Temps de réponse élevé"
          description: "Le p95 du temps de réponse est > 1s sur {{ $labels.view_name }}"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(django_http_responses_total_by_status{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Taux d'erreur élevé"
          description: "Plus de 5% d'erreurs 5xx détectées"

      # Database Connection Issues
      - alert: DatabaseConnectionIssues
        expr: django_db_errors_total > 10
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Problèmes de connexion base de données"
          description: "Plus de 10 erreurs DB en 5 minutes"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total{job="django-backend"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Utilisation CPU élevée"
          description: "CPU usage > 80% sur le backend"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="django-backend"} > 1073741824
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Utilisation mémoire élevée"
          description: "Mémoire > 1GB sur le backend"
