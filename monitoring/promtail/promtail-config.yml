server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # Image name
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

      # Service label from docker-compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp

      # Extract log level
      - labels:
          level:

      # Timestamp parsing
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Output formatting
      - output:
          source: message

  # Backend Django logs
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          service: django
          __path__: /var/log/django/*.log

    pipeline_stages:
      # Django log format parsing
      - regex:
          expression: '^\[(?P<timestamp>.*?)\] (?P<level>\w+) (?P<logger>[\w.]+): (?P<message>.*)'

      - labels:
          level:
          logger:

      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'

  # Nginx logs
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx
          __path__: /var/log/nginx/*access.log

    pipeline_stages:
      # Nginx access log format
      - regex:
          expression: '^(?P<remote_addr>[\w\.]+) - (?P<remote_user>[\w-]+) \[(?P<timestamp>.*?)\] "(?P<method>\w+) (?P<path>.*?) (?P<protocol>[\w/\.]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>.*?)" "(?P<http_user_agent>.*?)"'

      - labels:
          method:
          status:
          path:

      - timestamp:
          source: timestamp
          format: '02/Jan/2006:15:04:05 -0700'

  # Celery logs
  - job_name: celery
    static_configs:
      - targets:
          - localhost
        labels:
          job: celery
          service: celery
          __path__: /var/log/celery/*.log

    pipeline_stages:
      - regex:
          expression: '^\[(?P<timestamp>.*?)\: (?P<level>\w+)/(?P<worker>[\w@]+)\] (?P<message>.*)'

      - labels:
          level:
          worker:

      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
